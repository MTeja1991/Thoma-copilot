<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>thoma</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --border: #2a2f3d;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #c9a227;
      --user: #1e3a5f;
      --assistant: #1a1d27;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 260px;
      border-right: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-header h2 {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #chatList {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .chat-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .chat-item .chat-item-body { flex: 1; min-width: 0; }
    .chat-item .chat-item-del {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 6px;
      font-size: 1rem;
      line-height: 1;
      border-radius: 4px;
      opacity: 0;
      flex-shrink: 0;
    }
    .chat-item:hover .chat-item-del,
    .chat-item.active .chat-item-del { opacity: 1; }
    .chat-item .chat-item-del:hover { color: #f87171; background: #7f1d1d33; }
    .chat-item:hover { background: var(--bg); }
    .chat-item.active {
      background: var(--bg);
      border-color: var(--border);
    }
    .chat-item .title {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item .sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--panel);
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--accent);
      font-weight: 600;
    }
    header .meta { font-size: 0.8rem; color: var(--muted); }
    select, button, textarea {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    select {
      background: var(--bg);
      color: var(--text);
      padding: 8px 12px;
    }
    button {
      background: var(--accent);
      color: #111;
      border: none;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.danger {
      background: transparent;
      color: #f87171;
      border: 1px solid #7f1d1d;
    }
    .chat-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .chat-bar.hidden { display: none; }
    .chat-bar-title {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .chat-bar-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 6px;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--muted); }
    .icon-btn.danger:hover { color: #f87171; border-color: #7f1d1d; }
    .empty-chat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.95rem;
      padding: 40px 20px;
      text-align: center;
    }
    .empty-chat.hidden { display: none; }
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 800px;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border: 1px solid #2563eb44;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant);
      border: 1px solid var(--border);
    }
    .thinking-wrap {
      margin-bottom: 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .thinking-wrap summary {
      cursor: pointer;
      user-select: none;
      color: var(--accent);
      list-style: none;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .thinking-wrap summary::-webkit-details-marker { display: none; }
    .thinking-wrap:not([open]) summary .thinking-label::before { content: "▸ "; }
    .thinking-wrap[open] summary .thinking-label::before { content: "▾ "; }
    .thinking-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: thoma-spin 0.75s linear infinite;
      flex-shrink: 0;
    }
    .thinking-wrap:not(.streaming) .thinking-spinner { display: none; }
    .thinking-wrap.streaming .thinking-body { display: none; }
    @keyframes thoma-spin { to { transform: rotate(360deg); } }
    .thinking-body {
      border-left: 3px solid var(--accent);
      padding: 8px 10px;
      margin-top: 6px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .md-body { line-height: 1.55; }
    .md-body > :first-child { margin-top: 0; }
    .md-body > :last-child { margin-bottom: 0; }
    .md-body p { margin: 0.5em 0; }
    .md-body h1, .md-body h2, .md-body h3 { margin: 0.75em 0 0.35em; font-weight: 600; }
    .md-body ul, .md-body ol { margin: 0.4em 0; padding-left: 1.4em; }
    .md-body code {
      font-family: ui-monospace, monospace;
      font-size: 0.92em;
      background: rgba(127,127,127,0.15);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    .md-body pre {
      margin: 0.6em 0;
      padding: 10px 12px;
      overflow-x: auto;
      background: rgba(127,127,127,0.12);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .md-body pre code { background: none; padding: 0; }
    .md-body a { color: var(--accent); }
    .footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .status { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
    .error { color: #f87171; }
    pre {
      background: #0a0c10;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.9rem;
    }
    @media (max-width: 720px) {
      .sidebar { width: 200px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Chats</h2>
      <button id="newChatBtn" style="width:100%">+ New chat</button>
    </div>
    <div id="chatList"></div>
  </aside>

  <div class="main">
    <header>
      <h1>thoma</h1>
      <select id="profile" title="Model profile"></select>
      <button id="switchBtn" class="secondary">Switch model</button>
      <span class="meta" id="meta">Connecting…</span>
    </header>

    <div id="chatBar" class="chat-bar hidden">
      <span id="currentChatTitle" class="chat-bar-title"></span>
      <div class="chat-bar-actions">
        <button id="closeChatBtn" class="icon-btn" title="Close chat" aria-label="Close chat">×</button>
        <button id="deleteChatBtn" class="icon-btn danger" title="Delete chat" aria-label="Delete chat">⌫</button>
      </div>
    </div>

    <div id="emptyChat" class="empty-chat hidden">No chat open — pick one from the sidebar or start a new chat.</div>
    <div id="messages"></div>

    <div class="footer">
      <textarea id="input" placeholder="Ask thoma anything… (Enter to send, Shift+Enter for new line)"></textarea>
      <div class="row">
        <button id="sendBtn">Send</button>
        <span class="status" id="status"></span>
      </div>
    </div>
  </div>

  <script src="/web/marked.min.js"></script>
  <script>
    // Inlined — avoids /web/streamThinking.js load failures breaking live updates
    class StreamThinkingFilter {
      constructor() {
        this._pending = "";
        this._open = null;
        this._openClose = [
          ["<think>", "</think>"],
          ["<" + "think" + ">", "</" + "think" + ">"],
          ["<|think|>", "<|/think|>"],
          ["[THINK]", "[/THINK]"],
        ];
      }
      get inThinking() {
        return this._open !== null;
      }
      _partialSuffixLen(text) {
        const lower = text.toLowerCase();
        let best = 0;
        for (const [marker] of this._openClose) {
          const mlower = marker.toLowerCase();
          for (let i = 1; i < mlower.length; i++) {
            if (lower.endsWith(mlower.slice(0, i))) best = Math.max(best, i);
          }
        }
        return best;
      }
      feed(chunk) {
        if (!chunk) return ["", ""];
        this._pending += chunk;
        const reasoningOut = [];
        const contentOut = [];
        while (this._pending) {
          if (this._open === null) {
            let earliest = -1;
            let marker = "";
            for (const [openTag] of this._openClose) {
              const idx = this._pending.toLowerCase().indexOf(openTag.toLowerCase());
              if (idx !== -1 && (earliest === -1 || idx < earliest)) {
                earliest = idx;
                marker = openTag;
              }
            }
            if (earliest === -1) {
              const hold = this._partialSuffixLen(this._pending);
              if (hold) {
                contentOut.push(this._pending.slice(0, -hold));
                this._pending = this._pending.slice(-hold);
              } else {
                contentOut.push(this._pending);
                this._pending = "";
              }
              break;
            }
            contentOut.push(this._pending.slice(0, earliest));
            this._pending = this._pending.slice(earliest + marker.length);
            this._open = marker;
          } else {
            let close = "";
            for (const [openTag, closeTag] of this._openClose) {
              if (openTag === this._open) {
                close = closeTag;
                break;
              }
            }
            const idx = this._pending.toLowerCase().indexOf(close.toLowerCase());
            if (idx === -1) {
              const hold = Math.min(this._pending.length, Math.max(0, close.length - 1));
              const emit = hold ? this._pending.slice(0, -hold) : this._pending;
              if (emit) reasoningOut.push(emit);
              this._pending = hold ? this._pending.slice(-hold) : "";
              break;
            }
            reasoningOut.push(this._pending.slice(0, idx));
            this._pending = this._pending.slice(idx + close.length).replace(/^\s+/, "");
            this._open = null;
          }
        }
        return [reasoningOut.join(""), contentOut.join("")];
      }
      flush() {
        if (this._open) {
          const reasoning = this._pending;
          this._pending = "";
          this._open = null;
          return [reasoning, ""];
        }
        const content = this._pending;
        this._pending = "";
        return ["", content];
      }
    }

    const messagesEl = document.getElementById("messages");
    const profileEl = document.getElementById("profile");
    const inputEl = document.getElementById("input");
    const statusEl = document.getElementById("status");
    const metaEl = document.getElementById("meta");
    const chatListEl = document.getElementById("chatList");
    const chatBarEl = document.getElementById("chatBar");
    const currentChatTitleEl = document.getElementById("currentChatTitle");
    const emptyChatEl = document.getElementById("emptyChat");

    let chatId = null;

    const THINK_PATTERNS = [
      /<think>([\s\S]*?)<\/redacted_thinking>\s*/gi,
      new RegExp("<" + "think" + ">([\\s\\S]*?)</" + "think" + ">\\s*", "gi"),
      /<\|think\|>([\s\S]*?)<\|\/think\|>\s*/gi,
      /\[THINK\]([\s\S]*?)\[\/THINK\]\s*/gi,
    ];

    function extractThinking(text) {
      let thinking = "";
      let content = text || "";
      for (const re of THINK_PATTERNS) {
        content = content.replace(re, (_, block) => {
          thinking += (thinking ? "\n\n" : "") + block.trim();
          return "";
        });
      }
      return { thinking: thinking.trim(), content: content.trim() };
    }

    function createThinkingShell(streaming) {
      const details = document.createElement("details");
      details.className = "thinking-wrap" + (streaming ? " streaming" : "");
      const summary = document.createElement("summary");
      const spinner = document.createElement("span");
      spinner.className = "thinking-spinner";
      spinner.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.className = "thinking-label";
      label.textContent = "Thinking";
      summary.appendChild(spinner);
      summary.appendChild(label);
      const body = document.createElement("div");
      body.className = "thinking-body";
      details.appendChild(summary);
      details.appendChild(body);
      return details;
    }

    function createThinkingDetails(thinkingText) {
      if (!thinkingText) return null;
      const details = createThinkingShell(false);
      details.querySelector(".thinking-body").textContent = thinkingText;
      return details;
    }

    function ensureStreamingThinking(state) {
      if (!state.thinkingEl) {
        state.thinkingEl = createThinkingShell(true);
        state.div.insertBefore(state.thinkingEl, state.body);
      } else if (!state.thinkingEl.classList.contains("streaming")) {
        state.thinkingEl.classList.add("streaming");
        state.thinkingEl.querySelector(".thinking-body").textContent = "";
      }
    }

    function finalizeThinkingPanel(state, thinkingText) {
      if (!thinkingText) {
        if (state.thinkingEl) {
          state.thinkingEl.remove();
          state.thinkingEl = null;
        }
        state.thinkingText = "";
        return;
      }
      if (!state.thinkingEl) {
        state.thinkingEl = createThinkingShell(false);
        state.div.insertBefore(state.thinkingEl, state.body);
      } else {
        state.thinkingEl.classList.remove("streaming");
      }
      state.thinkingEl.querySelector(".thinking-body").textContent = thinkingText;
      state.thinkingText = thinkingText;
    }

    function renderMarkdown(text) {
      if (!text) return "";
      try {
        if (typeof marked !== "undefined") {
          return marked.parse(text, { breaks: true, gfm: true });
        }
      } catch (err) {
        console.warn("markdown render failed", err);
      }
      return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
    }

    function setMarkdownBody(el, text, streaming) {
      el.className = "md-body";
      if (streaming) {
        el.textContent = text;
        return;
      }
      el.innerHTML = renderMarkdown(text);
    }

    function updateChatChrome(title) {
      if (chatId && title) {
        chatBarEl.classList.remove("hidden");
        emptyChatEl.classList.add("hidden");
        currentChatTitleEl.textContent = title;
      } else {
        chatBarEl.classList.add("hidden");
        currentChatTitleEl.textContent = "";
      }
    }

    function showEmptyState() {
      clearMessages();
      emptyChatEl.classList.remove("hidden");
      updateChatChrome(null);
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
          const last = messagesEl.lastElementChild;
          if (last) {
            last.scrollIntoView({ block: "end", behavior: "instant" });
          }
        });
      });
    }

    function processSsePart(part, state, accum) {
      const line = part.trim();
      if (!line.startsWith("data: ")) return;
      const data = line.slice(6);
      if (data === "[DONE]") return;
      let chunk;
      try {
        chunk = JSON.parse(data);
      } catch (err) {
        console.warn("bad SSE JSON", err, data.slice(0, 120));
        return;
      }
      const delta = chunk.choices?.[0]?.delta || {};
      if (delta.content) {
        accum.content += delta.content;
        appendStreamDelta(state, delta.content, "");
      }
      if (delta.reasoning_content) {
        accum.reasoning += delta.reasoning_content;
        appendStreamDelta(state, "", delta.reasoning_content);
      }
    }

    async function streamChatCompletion(body) {
      const res = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...body, stream: true }),
      });
      if (!res.ok) throw new Error(await res.text());
      if (!res.body) throw new Error("No response body");

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      const accum = { content: "", reasoning: "" };

      const state = beginAssistantStream();

      while (true) {
        const { done, value } = await reader.read();
        if (value) {
          buffer += decoder.decode(value, { stream: !done });
        }
        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (const part of parts) {
          processSsePart(part, state, accum);
        }
        if (done) break;
      }
      buffer += decoder.decode();
      if (buffer.trim()) {
        processSsePart(buffer, state, accum);
      }

      finalizeAssistantStream(state, accum.content);
      return accum;
    }

    function beginAssistantStream() {
      const div = document.createElement("div");
      div.className = "msg assistant";
      const body = document.createElement("div");
      div.appendChild(body);
      messagesEl.appendChild(div);
      scrollToBottom();
      return {
        div,
        body,
        thinkingEl: null,
        thinkingText: "",
        rawContent: "",
        visibleText: "",
        streamFilter: new StreamThinkingFilter(),
      };
    }

    function appendStreamDelta(state, content, reasoning) {
      if (reasoning) {
        state.thinkingText = (state.thinkingText || "") + reasoning;
        ensureStreamingThinking(state);
      }
      if (content) {
        state.rawContent = (state.rawContent || "") + content;
        const [reasonFromContent, visible] = state.streamFilter.feed(content);
        if (reasonFromContent) {
          state.thinkingText = (state.thinkingText || "") + reasonFromContent;
          ensureStreamingThinking(state);
        }
        if (state.streamFilter.inThinking || state.thinkingText) {
          ensureStreamingThinking(state);
        }
        if (visible) {
          state.visibleText += visible;
          setMarkdownBody(state.body, state.visibleText, true);
        }
      }
      scrollToBottom();
    }

    function finalizeAssistantStream(state, fullText) {
      const [tailReasoning, tailContent] = state.streamFilter.flush();
      if (tailReasoning) {
        state.thinkingText = (state.thinkingText || "") + tailReasoning;
      }
      if (tailContent) {
        state.visibleText += tailContent;
      }
      const parsed = extractThinking(fullText || state.rawContent || "");
      const mergedThinking = [state.thinkingText, parsed.thinking].filter(Boolean).join("\n\n");
      finalizeThinkingPanel(state, mergedThinking);
      const text = parsed.content || state.visibleText;
      if (text) {
        setMarkdownBody(state.body, text);
      } else if (mergedThinking) {
        state.body.className = "md-body";
        state.body.innerHTML = "<p><em>Response contained reasoning only — expand Thinking above.</em></p>";
      }
      scrollToBottom();
    }

    function renderMsg(role, text, thinking) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      let displayText = text;
      let displayThinking = thinking || "";
      if (role === "assistant") {
        const parsed = extractThinking(text);
        displayText = parsed.content;
        displayThinking = [thinking, parsed.thinking].filter(Boolean).join("\n\n");
      }
      const thinkingEl = createThinkingDetails(displayThinking);
      if (thinkingEl) div.appendChild(thinkingEl);
      const body = document.createElement("div");
      if (role === "assistant") {
        setMarkdownBody(body, displayText);
      } else if (displayText.includes("```")) {
        body.innerHTML = displayText.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
          `<pre><code>${code.replace(/</g, "&lt;")}</code></pre>`
        );
      } else {
        body.textContent = displayText;
      }
      div.appendChild(body);
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function replaceLastAssistantMessage(content, thinking) {
      const nodes = messagesEl.querySelectorAll(".msg.assistant");
      const last = nodes.length ? nodes[nodes.length - 1] : null;
      if (last) last.remove();
      renderMsg("assistant", content, thinking || "");
    }

    async function syncAssistantFromServer(expectedUserText) {
      if (!chatId) return;
      for (let attempt = 0; attempt < 8; attempt++) {
        const res = await fetch(`/v1/chats/${chatId}`);
        if (!res.ok) return;
        const chat = await res.json();
        const msgs = chat.messages || [];
        const last = msgs[msgs.length - 1];
        if (last?.role === "assistant") {
          replaceLastAssistantMessage(last.content, last.reasoning_content);
          updateChatChrome(chat.title);
          return;
        }
        if (expectedUserText && msgs.some((m) => m.role === "user" && m.content === expectedUserText)) {
          await new Promise((r) => setTimeout(r, 80));
          continue;
        }
        await new Promise((r) => setTimeout(r, 80));
      }
    }

    function clearMessages() {
      messagesEl.innerHTML = "";
    }

    function loadChatIntoView(chat) {
      clearMessages();
      (chat.messages || []).forEach((m) => {
        renderMsg(m.role, m.content, m.reasoning_content || "");
      });
      scrollToBottom();
      if (chat.profile && profileEl.querySelector(`option[value="${chat.profile}"]`)) {
        profileEl.value = chat.profile;
      }
    }

    async function loadModels() {
      const health = await fetch("/health").then((r) => r.json());
      metaEl.textContent = `${health.inference} · ${health.accelerator} · ${health.active_profile}`;
      const res = await fetch("/v1/models");
      const data = await res.json();
      profileEl.innerHTML = "";
      data.data.forEach((m) => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.id + (m.active ? " ●" : "");
        if (m.active) opt.selected = true;
        profileEl.appendChild(opt);
      });
    }

    async function refreshChatList() {
      const res = await fetch("/v1/chats");
      const data = await res.json();
      chatListEl.innerHTML = "";
      data.data.forEach((c) => {
        const el = document.createElement("div");
        el.className = "chat-item" + (c.id === chatId ? " active" : "");
        el.dataset.id = c.id;

        const body = document.createElement("div");
        body.className = "chat-item-body";
        body.innerHTML = `<div class="title">${escapeHtml(c.title)}</div>
          <div class="sub">${c.message_count || 0} msgs · ${c.profile}</div>`;
        body.onclick = () => openChat(c.id);

        const del = document.createElement("button");
        del.className = "chat-item-del";
        del.title = "Delete chat";
        del.setAttribute("aria-label", "Delete chat");
        del.textContent = "×";
        del.onclick = (e) => {
          e.stopPropagation();
          deleteChatById(c.id, c.title);
        };

        el.appendChild(body);
        el.appendChild(del);
        chatListEl.appendChild(el);
      });
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function openChat(id) {
      chatId = id;
      emptyChatEl.classList.add("hidden");
      const res = await fetch(`/v1/chats/${id}`);
      const chat = await res.json();
      loadChatIntoView(chat);
      updateChatChrome(chat.title);
      await refreshChatList();
    }

    function closeChat() {
      chatId = null;
      showEmptyState();
      refreshChatList();
    }

    async function deleteChatById(id, title) {
      if (!confirm(`Delete "${title || "this chat"}"?`)) return;
      await fetch(`/v1/chats/${id}`, { method: "DELETE" });
      if (chatId === id) {
        chatId = null;
        showEmptyState();
      }
      await refreshChatList();
    }

    async function deleteCurrentChat() {
      if (!chatId) return;
      const title = currentChatTitleEl.textContent;
      await deleteChatById(chatId, title);
    }

    async function createChat() {
      const res = await fetch("/v1/chats", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ profile: profileEl.value }),
      });
      const chat = await res.json();
      chatId = chat.id;
      clearMessages();
      emptyChatEl.classList.add("hidden");
      updateChatChrome(chat.title);
      await refreshChatList();
      inputEl.focus();
    }

    document.getElementById("switchBtn").onclick = async () => {
      statusEl.textContent = "Switching model…";
      try {
        await fetch(`/v1/profiles/${profileEl.value}/switch`, { method: "POST" });
        await loadModels();
        statusEl.textContent = "Model switched.";
      } catch (e) {
        statusEl.textContent = "Switch failed.";
        statusEl.className = "status error";
      }
    };

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      if (!chatId) await createChat();

      emptyChatEl.classList.add("hidden");
      inputEl.value = "";
      renderMsg("user", text);
      statusEl.textContent = "Thinking…";
      statusEl.className = "status";
      document.getElementById("sendBtn").disabled = true;

      try {
        await streamChatCompletion({
          model: profileEl.value,
          chat_id: chatId,
          messages: [{ role: "user", content: text }],
        });
        await syncAssistantFromServer(text);
        statusEl.textContent = "";
        await refreshChatList();
      } catch (e) {
        statusEl.textContent = "Error: " + e.message;
        statusEl.className = "status error";
      }
      document.getElementById("sendBtn").disabled = false;
    }

    document.getElementById("sendBtn").onclick = send;
    document.getElementById("newChatBtn").onclick = createChat;
    document.getElementById("closeChatBtn").onclick = closeChat;
    document.getElementById("deleteChatBtn").onclick = deleteCurrentChat;

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    (async () => {
      try {
        await loadModels();
        await refreshChatList();
        const res = await fetch("/v1/chats");
        const data = await res.json();
        if (data.data.length) {
          await openChat(data.data[0].id);
        } else {
          showEmptyState();
        }
      } catch {
        metaEl.textContent = "API not running — start with ./docker/scripts/start-smoke.sh";
        metaEl.className = "meta error";
      }
    })();
  </script>
</body>
</html>
