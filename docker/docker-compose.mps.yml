# Apple Silicon (MPS/Metal) — Ollama runs natively on macOS host, API in Docker
# Ollama inside Docker on Mac does NOT use Metal; host Ollama does.
#
# Usage:
#   1. Install Ollama.app or `brew install ollama` and run: ollama serve
#   2. cp .env.mps.example .env.mps
#   3. docker compose -f docker-compose.mps.yml --env-file .env.mps up -d --build
services:
  thoma-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        INSTALL_LLAMACPP: "0"
    container_name: thoma-api
    restart: unless-stopped
    ports:
      - "${THOMA_API_PORT:-8080}:8080"
    environment:
      - THOMA_ENV=${THOMA_ENV:-production}
      - THOMA_API_HOST=0.0.0.0
      - THOMA_API_PORT=8080
      - THOMA_BACKEND=mps
      - THOMA_INFERENCE_BACKEND=ollama
      - THOMA_DEFAULT_PROFILE=${THOMA_DEFAULT_PROFILE:-thoma-reason}
      - THOMA_MODELS_CONFIG=${THOMA_MODELS_CONFIG:-/app/config/models-mps-16gb.yaml}
      - THOMA_PROJECT_ROOT=/app
      - THOMA_DATA_DIR=data
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - THOMA_AUTH_ENABLED=${THOMA_AUTH_ENABLED:-0}
      - THOMA_API_KEY=${THOMA_API_KEY:-}
      - THOMA_LOG_LEVEL=${THOMA_LOG_LEVEL:-INFO}
    volumes:
      - ../config:/app/config:ro
      - thoma_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  thoma_data:
