# Overlay for NVIDIA CUDA GPUs (RTX 4050, etc.)
# Usage: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
services:
  ollama:
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  thoma-api:
    build:
      args:
        INSTALL_LLAMACPP: "0"
    environment:
      - THOMA_BACKEND=nvidia
      - THOMA_INFERENCE_BACKEND=ollama
