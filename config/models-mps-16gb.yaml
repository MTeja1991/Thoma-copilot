# Thoma model profiles — Apple Silicon, 16 GB+ unified memory (M1 Pro/Max, M2+, M3+)
# Ollama on macOS uses Metal (MPS) automatically.

hardware:
  backend: mps
  platform: apple-silicon
  unified_memory_gb: 16
  accelerator: metal
  max_loaded_models: 1
  default_context: 8192

profiles:
  thoma-reason:
    description: "Thinking model — Qwen3 with enable_thinking"
    ollama_model: "qwen3:8b"
    thinking: true
    context_length: 8192
    memory_estimate_gb: "5.0-6.5"
    priority: primary

  thoma-reason-distill:
    description: "DeepSeek R1 distill — visible reasoning"
    ollama_model: "deepseek-r1:7b"
    thinking: true
    context_length: 8192
    memory_estimate_gb: "4.5-5.5"
    priority: primary

  thoma-code:
    description: "Primary coding model at Q4 on 16GB"
    ollama_model: "qwen2.5-coder:7b"
    thinking: false
    context_length: 8192
    memory_estimate_gb: "4.5-5.5"
    priority: primary

  thoma-fast:
    description: "Fast non-thinking chat"
    ollama_model: "qwen3:4b"
    thinking: false
    context_length: 8192
    memory_estimate_gb: "2.5-3.5"
    priority: primary

  thoma-reason-lite:
    description: "Low memory fallback"
    ollama_model: "qwen2.5-coder:3b"
    thinking: false
    context_length: 4096
    memory_estimate_gb: "2.0-2.5"
    priority: fallback

stretch_profiles:
  thoma-code-14b:
    description: "Higher quality code — may be slow on 16GB"
    ollama_model: "qwen2.5-coder:14b"
    thinking: false
    context_length: 4096
    memory_estimate_gb: "8.0-10.0"
    notes: "Use 4K context; quit memory-heavy apps"

  thoma-reason-14b:
    description: "Stronger reasoning distill"
    ollama_model: "deepseek-r1:14b"
    thinking: true
    context_length: 4096
    memory_estimate_gb: "8.0-10.0"
    notes: "Stretch profile for M2 Pro 16GB+"

default_profile: thoma-reason

pull_order:
  - qwen3:8b
  - qwen2.5-coder:7b
  - deepseek-r1:7b
  - qwen3:4b
  - qwen2.5-coder:3b
